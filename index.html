<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Roster</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap');

:root{
  --paper:#FBF3E6;
  --paper-raised:#FFFFFF;
  --ink:#2B1B12;
  --ink-soft:#5A4A3D;
  --ink-faint:#8C7862;
  --line:#DBBE83;
  --line-soft:#EEDFBA;
  --maroon:#6E1F2B;
  --maroon-deep:#4A141C;
  --accent:#6E1F2B;
  --accent-ink:#4A141C;
  --accent-soft:#F2E0DE;
  --gold:#C79A3C;
  --gold-light:#E7C77E;
  --gold-soft:#F3E6C9;
  --rust:#A8402E;
  --rust-soft:#F3DFD9;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Jost',system-ui,sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:600;
  margin:0;
  color:var(--ink);
}
button{font-family:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
::selection{background:var(--accent-soft);}
a{color:inherit;}

#app{min-height:100%;}

/* ---------- Login ---------- */
.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:10px;
  padding:36px 32px;
  box-shadow:0 14px 34px rgba(74,20,28,0.08);
}
.login-mark{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:16px;
  color:var(--maroon-deep);
  margin-bottom:4px;
}
.login-card h1{font-size:24px;margin-bottom:6px;}
.login-sub{color:var(--ink-soft);font-size:13px;margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field-hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.checkbox-field{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;}
.checkbox-field input{width:auto;margin-top:3px;}
.checkbox-field label{font-size:12.5px;color:var(--ink-soft);}
.person-list{display:flex;flex-direction:column;gap:10px;}
.person-btn{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  width:100%;
  padding:16px 18px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  transition:border-color .15s ease, background .15s ease;
}
.person-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.person-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:16px;color:var(--ink);}
.person-role{font-size:12.5px;color:var(--ink-soft);}
.role-toggle{display:flex;gap:8px;}
.role-btn{
  flex:1;
  padding:11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  cursor:pointer;
  text-align:center;
  color:var(--ink-soft);
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.role-btn.selected{border-color:var(--maroon);background:var(--accent-soft);color:var(--maroon-deep);font-weight:500;}
.role-btn:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.primary-btn{
  width:100%;
  margin-top:8px;
  padding:12px;
  background:var(--maroon);
  color:var(--gold-light);
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:500;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.primary-btn:hover{background:var(--maroon-deep);transform:translateY(-1px);box-shadow:0 8px 20px rgba(74,20,28,0.22);}
.primary-btn:disabled{background:var(--ink-faint);color:#fff;cursor:not-allowed;transform:none;box-shadow:none;}
.login-error{color:var(--rust);font-size:12px;margin-top:10px;}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:220px;
  flex-shrink:0;
  background:var(--paper-raised);
  border-right:1px solid var(--line);
  padding:24px 0;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.sidebar-header{padding:0 24px 20px;border-bottom:1px solid var(--line-soft);margin-bottom:12px;}
.sidebar-mark{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--maroon-deep);}
.sidebar-user{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.sidebar-user strong{color:var(--ink);font-weight:500;}
nav.nav-list{display:flex;flex-direction:column;}
.nav-item{
  padding:11px 24px;
  border-left:3px solid transparent;
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.nav-item:hover{background:var(--accent-soft);color:var(--ink);}
.nav-item.active{border-left-color:var(--accent);color:var(--accent-ink);font-weight:500;background:var(--accent-soft);}
.nav-badge{
  font-size:11px;
  background:var(--rust-soft);
  color:var(--rust);
  padding:1px 7px;
  border-radius:9px;
}
.sidebar-footer{padding:16px 24px 0;margin-top:16px;border-top:1px solid var(--line-soft);}
.signout-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;padding:0;}
.signout-btn:hover{color:var(--rust);}

.main{flex:1;padding:40px 44px;max-width:980px;}
.view-header{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.view-header h2{font-size:22px;}
.view-sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}

.mobile-topbar{display:none;}

/* ---------- Buttons ---------- */
.btn{
  padding:9px 18px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--ink);
  cursor:pointer;
  transition:border-color .15s ease, color .15s ease;
}
.btn:hover{border-color:var(--maroon);color:var(--maroon-deep);}
.btn-accent{background:var(--maroon);border-color:var(--maroon);color:var(--gold-light);}
.btn-accent:hover{background:var(--maroon-deep);border-color:var(--maroon-deep);color:var(--gold-light);}
.btn-sm{padding:5px 14px;font-size:12.5px;}
.btn-text{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px 6px;}
.btn-text:hover{color:var(--rust);}
.btn-text.approve:hover{color:var(--maroon-deep);}

/* ---------- Ledger rows ---------- */
.ledger{border-top:1px solid var(--line);}
.ledger-row{
  display:grid;
  padding:14px 4px;
  border-bottom:1px solid var(--line-soft);
  align-items:center;
  gap:12px;
}
.ledger-row.head{
  color:var(--ink-faint);
  font-size:11.5px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.ledger-row:hover{background:rgba(0,0,0,0.015);}
.cell-name{font-weight:500;}
.cell-sub{color:var(--ink-soft);font-size:12.5px;}
.member-code{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  letter-spacing:.03em;
  font-size:11px;
  color:var(--maroon-deep);
  background:var(--gold-soft);
  border:1px solid var(--line);
  border-radius:999px;
  padding:1px 8px;
  display:inline-block;
  margin-bottom:2px;
}
.tag{
  display:inline-block;
  font-size:11.5px;
  padding:2px 11px;
  border-radius:999px;
}
.tag-active{background:var(--accent-soft);color:var(--maroon-deep);}
.tag-inactive{background:var(--line-soft);color:var(--ink-faint);}
.tag-pending{background:var(--gold-soft);color:#8A6A1F;}
.tag-approved{background:var(--accent-soft);color:var(--maroon-deep);}
.tag-denied{background:var(--rust-soft);color:var(--rust);}

.empty-state{
  padding:48px 24px;
  text-align:center;
  color:var(--ink-faint);
  border:1px dashed var(--line);
  border-radius:10px;
  margin-top:8px;
}
.empty-state p{margin:0 0 14px;}

/* ---------- Stat cards ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:32px;}
.stat{background:var(--paper-raised);padding:20px;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--maroon-deep);}
.stat-label{font-size:12px;color:var(--ink-soft);margin-top:4px;}

.section-title{font-size:14px;font-weight:600;margin:32px 0 12px;font-family:'Cormorant Garamond',serif;}
.section-title:first-child{margin-top:0;}
.tab-row{display:flex;gap:8px;margin-bottom:8px;}
.tab-btn{
  padding:8px 18px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
}
.tab-btn.active{background:var(--accent-soft);border-color:var(--maroon);color:var(--maroon-deep);font-weight:500;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(33,38,43,0.4);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:50;
}
.panel{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:10px;
  width:100%;max-width:460px;
  padding:28px;
}
.panel h3{font-size:18px;margin-bottom:20px;}
.panel-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.panel-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);
  color:#fff;
  padding:11px 16px;
  border-radius:999px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:12px;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
  z-index:100;
  max-width:90vw;
  box-shadow:0 4px 16px rgba(74,20,28,0.25);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast-error{background:var(--rust);}
.toast-success{background:var(--maroon-deep);}
.toast-retry{
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.4);
  color:#fff;
  border-radius:999px;
  padding:4px 12px;
  cursor:pointer;
  flex-shrink:0;
}
.toast-retry:hover{background:rgba(255,255,255,0.25);}

@media (max-width:820px){
  .sidebar{display:none;}
  .mobile-topbar{
    display:flex;
    align-items:stretch;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .mobile-topbar-nav{display:flex;overflow-x:auto;flex:1;min-width:0;}
  .mobile-topbar .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:14px 16px;}
  .mobile-topbar .nav-item.active{border-bottom-color:var(--accent);}
  .mobile-signout{
    flex-shrink:0;
    border:none;
    border-left:1px solid var(--line);
    background:none;
    color:var(--ink-faint);
    font-size:12.5px;
    padding:0 16px;
    cursor:pointer;
  }
  .mobile-signout:active{color:var(--rust);}
  .main{padding:24px 18px 60px;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .panel-row{grid-template-columns:1fr;}
  .ledger-row{font-size:13px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var VIEWS = ["dashboard","members","projects","intake","receipts","testimonials","services","leave","performance"];
  var VIEW_LABELS = {dashboard:"Dashboard",members:"Members",projects:"Projects",intake:"Intake",receipts:"Receipts",testimonials:"Testimonials",services:"Services",leave:"Leave requests",performance:"Performance notes"};

  var state = {
    pin:null,
    user:null,
    view:"dashboard",
    members:[],
    leave:[],
    performance:[],
    projects:[],
    handovers:[],
    receipts:[],
    testimonials:[],
    kycRecords:[],
    services:[],
    sheetsConfigured:{bookings:false, kyc:false, enrollment:false, existing:false},
    memberEnrollmentFormUrl:"",
    intakeTab:"bookings",
    intakeRows:{bookings:null, kyc:null, enrollment:null, existing:null},
    intakeLoading:false,
    loading:true,
    modal:null
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){
    if(!d) return "—";
    var dt = new Date(d + "T00:00:00");
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function memberName(id){
    var m = state.members.find(function(x){return x.id===id;});
    return m ? m.name : "Unknown";
  }
  function memberCode(id){
    var m = state.members.find(function(x){return x.id===id;});
    return m ? m.memberCode : "";
  }

  // ---------------- Session ----------------
  function loadSession(){
    try{
      var raw = localStorage.getItem("roster_session");
      if(!raw) return;
      var s = JSON.parse(raw);
      state.pin = s.pin || null;
      if(s.name && s.role) state.user = {name:s.name, role:s.role};
    }catch(e){}
  }
  function saveSession(){
    try{
      localStorage.setItem("roster_session", JSON.stringify({
        pin: state.pin,
        name: state.user ? state.user.name : null,
        role: state.user ? state.user.role : null
      }));
    }catch(e){}
  }
  function clearSession(){
    try{ localStorage.removeItem("roster_session"); }catch(e){}
  }

  // ---------------- API ----------------
  async function apiGet(){
    var res = await fetch("/api/roster", { headers: { "x-roster-pin": state.pin } });
    if(res.status === 401) throw {authError:true};
    var data = await res.json();
    if(!data.ok) throw new Error(data.error || "Request failed");
    return data;
  }
  async function apiPost(resource, action, payload){
    var res = await fetch("/api/roster", {
      method:"POST",
      headers: { "Content-Type":"application/json", "x-roster-pin": state.pin },
      body: JSON.stringify({resource:resource, action:action, payload:payload})
    });
    if(res.status === 401) throw {authError:true};
    var data = await res.json();
    if(!data.ok) throw new Error(data.error || "Request failed");
    return data;
  }

  async function loadAll(){
    try{
      var data = await apiGet();
      state.members = data.members;
      state.leave = data.leave;
      state.performance = data.performance;
      state.projects = data.projects;
      state.handovers = data.handovers;
      state.receipts = data.receipts || [];
      state.testimonials = data.testimonials || [];
      state.kycRecords = data.kycRecords || [];
      state.services = data.services || [];
      state.sheetsConfigured = data.sheetsConfigured || state.sheetsConfigured;
      state.memberEnrollmentFormUrl = data.memberEnrollmentFormUrl || "";
    }catch(err){
      if(err && err.authError){
        state.pin = null;
        clearSession();
        window.__rosterPinFailed = true;
      }else{
        console.error("Load failed", err);
        showToast("Couldn't load the latest roster data.", "error", loadAll);
      }
    }
    state.loading = false;
    render();
  }

  var toastTimer = null;
  function showToast(msg, kind, retryFn){
    var el = document.getElementById("toast");
    if(!el){
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.className = "toast toast-" + (kind||"info") + " show";
    el.innerHTML = '<span>'+esc(msg)+'</span>';
    if(retryFn){
      var btn = document.createElement("button");
      btn.className = "toast-retry";
      btn.textContent = "Retry";
      btn.addEventListener("click", function(){ hideToast(); retryFn(); });
      el.appendChild(btn);
    }
    if(toastTimer) clearTimeout(toastTimer);
    if(!retryFn){ toastTimer = setTimeout(hideToast, 2200); }
  }
  function hideToast(){
    var el = document.getElementById("toast");
    if(el) el.className = "toast";
  }

  async function mutate(resource, action, payload, successMsg, onSuccess){
    try{
      var result = await apiPost(resource, action, payload);
      showToast(successMsg || "Saved.", "success");
      await loadAll();
      if(onSuccess) onSuccess(result);
      return result;
    }catch(err){
      if(err && err.authError){
        state.pin = null;
        clearSession();
        render();
        return;
      }
      console.error("Save failed", err);
      showToast("Couldn't save — try again.", "error", function(){ mutate(resource, action, payload, successMsg, onSuccess); });
    }
  }

  // ---------------- Actions ----------------
  function checkPin(pin){
    state.pin = pin;
    saveSession();
    loadAll();
  }
  function signIn(name, role){
    state.user = {name:name, role:role};
    state.view = "dashboard";
    saveSession();
    render();
  }
  function signOut(){
    state.user = null;
    state.pin = null;
    clearSession();
    render();
  }
  function setView(v){
    state.view = v;
    render();
    if(v==="intake" && state.intakeRows[state.intakeTab] === null){ loadIntake(state.intakeTab); }
  }
  function openModal(type, data){ state.modal = {type:type, data:data||null}; render(); }
  function closeModal(){ state.modal = null; render(); }

  function saveMember(form){
    var isEdit = !!form.id;
    var rec = {
      id: form.id || uid(),
      name: form.name.trim(),
      title: form.title.trim(),
      department: form.department.trim(),
      email: form.email.trim(),
      phone: form.phone.trim(),
      location: form.location.trim(),
      startDate: form.startDate || todayStr(),
      status: form.status || "active"
    };
    closeModal();
    mutate("members", isEdit ? "update" : "create", rec, isEdit ? "Saved." : "Member added.");
  }
  function deleteMember(id){
    if(!confirm("Remove this member from the roster? This won't delete their leave or performance history.")) return;
    mutate("members", "delete", {id:id});
  }

  function saveLeave(form){
    var rec = {
      id:uid(), memberId:form.memberId, type:form.type, startDate:form.startDate, endDate:form.endDate,
      note:(form.note||"").trim(), requestedBy: state.user.name
    };
    closeModal();
    mutate("leave", "create", rec);
  }
  function setLeaveStatus(id, status){ mutate("leave", "setStatus", {id:id, status:status}); }
  function deleteLeave(id){ mutate("leave", "delete", {id:id}); }

  function savePerformance(form){
    var rec = { id:uid(), memberId:form.memberId, date:form.date||todayStr(), rating:form.rating||"", note:form.note.trim(), author: state.user.name };
    closeModal();
    mutate("performance", "create", rec);
  }
  function deletePerformance(id){ mutate("performance", "delete", {id:id}); }

  function saveProject(form){
    var rec = {
      id:uid(), name:form.name.trim(), description:(form.description||"").trim(), memberId:form.memberId, note:(form.note||"").trim(),
      clientName:(form.clientName||"").trim(), service:form.service||"", budget:form.budget?Number(form.budget):null,
      location:(form.location||"").trim(), eventDate:form.eventDate||null
    };
    closeModal();
    mutate("projects", "create", rec, "Project created — the assigned member has been emailed.");
  }
  function handoverProject(form){
    var rec = { id:form.id, toMemberId:form.toMemberId, note:(form.note||"").trim(), notifyPrevious:form.notifyPrevious };
    closeModal();
    mutate("projects", "handover", rec, "Handed over — notification emails sent.");
  }
  function deleteProject(id){
    if(!confirm("Delete this project and its handover history?")) return;
    mutate("projects", "delete", {id:id});
  }
  function createProjectFromBooking(row){
    openModal("project", {
      prefill:true,
      clientName: row["Client Name"]||"", service: row["Service"]||"",
      location: row["Location"]||"", budget: row["Budget"]||"",
      eventDate: row["Event Date"]||"", description: row["Notes"]||""
    });
  }

  // ---------------- Receipts ----------------
  function generateReceiptPdf(rec){
    try{
      var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
      if(!jsPDFCtor){ showToast("PDF library didn't load — try again in a moment.", "error"); return; }
      var doc = new jsPDFCtor({ unit:"pt", format:"a5" });
      var maroon = [110,31,43];
      doc.setFont("times","bold"); doc.setFontSize(22); doc.setTextColor(maroon[0],maroon[1],maroon[2]);
      doc.text("Samskar", 40, 50);
      doc.setFont("times","italic"); doc.setFontSize(11); doc.setTextColor(90,74,61);
      doc.text("crafting traditions with trend", 40, 68);
      doc.setDrawColor(199,154,60); doc.line(40, 80, 380, 80);

      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(43,27,18);
      var y = 108;
      function line(label, value){
        doc.setFont("helvetica","bold"); doc.text(label, 40, y);
        doc.setFont("helvetica","normal"); doc.text(String(value||"—"), 160, y);
        y += 22;
      }
      doc.setFont("times","bold"); doc.setFontSize(15); doc.text("Receipt", 40, 96);
      line("Receipt No.", rec.receiptNo);
      line("Date", rec.receiptDate);
      line("Client", rec.clientName);
      if(rec.contact) line("Contact", rec.contact);
      if(rec.service) line("Service", rec.service);
      line("Payment mode", rec.paymentMode || "—");
      if(rec.note) line("Note", rec.note);

      doc.setDrawColor(219,190,131); doc.line(40, y, 380, y); y += 26;
      doc.setFont("times","bold"); doc.setFontSize(16);
      doc.text("Amount paid: Rs. " + Number(rec.amount).toLocaleString('en-IN'), 40, y);
      y += 34;
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(140,120,98);
      doc.text("Issued by " + (rec.issuedBy || "Samskar") + " · Generated via The Roster", 40, y);

      doc.save((rec.receiptNo || "receipt") + ".pdf");
    }catch(err){
      console.error("PDF generation failed", err);
      showToast("Couldn't generate the PDF.", "error");
    }
  }

  // ---------------- Intake (Tally responses) ----------------
  async function loadIntake(key){
    state.intakeLoading = true;
    render();
    try{
      var result = await apiPost("sheet", "fetch", { key:key });
      state.intakeRows[key] = result.rows;
      state.sheetsConfigured[key] = result.configured;
    }catch(err){
      if(err && err.authError){ state.pin=null; clearSession(); render(); return; }
      console.error("Intake fetch failed", err);
      showToast((err && err.message) || "Couldn't load responses from Tally.", "error");
      state.intakeRows[key] = [];
    }
    state.intakeLoading = false;

  function bindLogin(){
    var selectedRole = "CEO";
    var roleBtns = document.querySelectorAll(".role-btn");
    roleBtns.forEach(function(btn){
      btn.addEventListener("click", function(){
        roleBtns.forEach(function(b){ b.classList.remove("selected"); });
        btn.classList.add("selected");
        selectedRole = btn.getAttribute("data-role");
      });
    });
    var nameInput = document.getElementById("in-name");
    function submit(){
      var name = nameInput.value;
      if(!name || !name.trim()){
        document.getElementById("login-err").style.display = "block";
        return;
      }
      signIn(name.trim(), selectedRole);
    }
    document.getElementById("btn-signin").addEventListener("click", submit);
    nameInput.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
    nameInput.focus();
  }

  function renderTestimonials(){
    var html = '<div class="view-header"><div><h2>Testimonials</h2><div class="view-sub">What clients have said, in one place.</div></div>'+
      '<button class="btn btn-accent" data-open-modal="testimonial">Add testimonial</button></div>';

    if(state.testimonials.length===0){
      html += '<div class="empty-state"><p>No testimonials yet.</p><button class="btn" data-open-modal="testimonial">Add the first one</button></div>';
      return html;
    }

    var rated = state.testimonials.filter(function(t){ return t.rating; });
    var avg = rated.length ? (rated.reduce(function(s,t){ return s+t.rating; },0)/rated.length).toFixed(1) : null;

  // ---------------- Event binding ----------------
  function bindShell(){
    document.getElementById("btn-signout").addEventListener("click", signOut);
    var mobileSignout = document.getElementById("btn-signout-mobile");
    if(mobileSignout) mobileSignout.addEventListener("click", signOut);

    document.querySelectorAll("[data-view]").forEach(function(el){
      el.addEventListener("click", function(){ setView(el.getAttribute("data-view")); });
    });
    document.querySelectorAll("[data-open-modal]").forEach(function(el){
      el.addEventListener("click", function(){
        if(el.disabled) return;
        openModal(el.getAttribute("data-open-modal"), null);
      });
    });
    document.querySelectorAll("[data-edit-member]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-edit-member");
        var mem = state.members.find(function(x){ return x.id===id; });
        openModal("member", mem);
      });
    });
    document.querySelectorAll("[data-delete-member]").forEach(function(el){
      el.addEventListener("click", function(){ deleteMember(el.getAttribute("data-delete-member")); });
    });
    document.querySelectorAll("[data-open-handover]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-open-handover");
        var proj = state.projects.find(function(x){ return x.id===id; });
        openModal("handover", proj);
      });
    });
    document.querySelectorAll("[data-delete-project]").forEach(function(el){
      el.addEventListener("click", function(){ deleteProject(el.getAttribute("data-delete-project")); });
    });
    document.querySelectorAll("[data-approve-leave]").forEach(function(el){
      el.addEventListener("click", function(){ setLeaveStatus(el.getAttribute("data-approve-leave"), "approved"); });
    });
    document.querySelectorAll("[data-deny-leave]").forEach(function(el){
      el.addEventListener("click", function(){ setLeaveStatus(el.getAttribute("data-deny-leave"), "denied"); });
    });
    document.querySelectorAll("[data-delete-leave]").forEach(function(el){
      el.addEventListener("click", function(){ deleteLeave(el.getAttribute("data-delete-leave")); });
    });
    document.querySelectorAll("[data-delete-performance]").forEach(function(el){
      el.addEventListener("click", function(){ deletePerformance(el.getAttribute("data-delete-performance")); });
    });

    document.querySelectorAll("[data-intake-tab]").forEach(function(el){
      el.addEventListener("click", function(){ setIntakeTab(el.getAttribute("data-intake-tab")); });
    });
    document.querySelectorAll("[data-connect-tally]").forEach(function(el){
      el.addEventListener("click", async function(){
        el.disabled = true;
        try{
          var r = await apiPost("tally", "connect", {});
          var failed = (r.results||[]).filter(function(x){ return x.status==="failed"; });
          if(failed.length){
            showToast("Couldn't connect: " + failed.map(function(f){ return f.form+" ("+f.code+")"; }).join(", "), "error");
          } else {
            showToast("All four forms are connected to your database.", "success");
          }
        }catch(err){
          showToast((err && err.message && !err.authError) ? err.message : "Couldn't connect the forms.", "error");
        }
        el.disabled = false;
      });
    });
    document.querySelectorAll("[data-refresh-intake]").forEach(function(el){
      el.addEventListener("click", function(){ loadIntake(el.getAttribute("data-refresh-intake")); });
    });
    document.querySelectorAll("[data-add-member-row]").forEach(function(el){
      el.addEventListener("click", function(){
        var row = state.intakeRows.enrollment[parseInt(el.getAttribute("data-add-member-row"),10)];
        addMemberFromRow(row);
      });
    });
    document.querySelectorAll("[data-save-kyc-row]").forEach(function(el){
      el.addEventListener("click", function(){
        var row = state.intakeRows.kyc[parseInt(el.getAttribute("data-save-kyc-row"),10)];
        saveKycFromRow(row);
      });
    });
    document.querySelectorAll("[data-create-project-existing]").forEach(function(el){
      el.addEventListener("click", function(){
        var row = state.intakeRows.existing[parseInt(el.getAttribute("data-create-project-existing"),10)];
        if(row && row["__match"]==="verified"){ createProjectFromBooking(row); }
      });
    });
    document.querySelectorAll("[data-create-project-row]").forEach(function(el){
      el.addEventListener("click", function(){
        var row = state.intakeRows.bookings[parseInt(el.getAttribute("data-create-project-row"),10)];
        createProjectFromBooking(row);
      });
    });

    document.querySelectorAll("[data-reprint-receipt]").forEach(function(el){
      el.addEventListener("click", function(){
        var rec = state.receipts.find(function(r){ return r.id===el.getAttribute("data-reprint-receipt"); });
        if(rec) generateReceiptPdf(rec);
      });
    });
    document.querySelectorAll("[data-delete-receipt]").forEach(function(el){
      el.addEventListener("click", function(){ deleteReceipt(el.getAttribute("data-delete-receipt")); });
    });
    document.querySelectorAll("[data-delete-testimonial]").forEach(function(el){
      el.addEventListener("click", function(){ deleteTestimonial(el.getAttribute("data-delete-testimonial")); });
    });
    document.querySelectorAll("[data-edit-service]").forEach(function(el){
      el.addEventListener("click", function(){
        var svc = state.services.find(function(s){ return s.id===el.getAttribute("data-edit-service"); });
        openModal("service", svc);
      });
    });
    document.querySelectorAll("[data-delete-service]").forEach(function(el){
      el.addEventListener("click", function(){ deleteService(el.getAttribute("data-delete-service")); });
    });

    var overlay = document.getElementById("overlay");
    if(overlay){
      overlay.addEventListener("click", function(e){ if(e.target===overlay) closeModal(); });
      document.querySelectorAll("[data-close-modal]").forEach(function(el){ el.addEventListener("click", closeModal); });

      var saveMem = document.getElementById("save-member");
      if(saveMem){
        saveMem.addEventListener("click", function(){
          var name = document.getElementById("f-name").value;
          if(!name.trim()){ document.getElementById("f-name").focus(); return; }
          saveMember({
            id: state.modal.data ? state.modal.data.id : null,
            name: name,
            title: document.getElementById("f-title").value,
            department: document.getElementById("f-department").value,
            email: document.getElementById("f-email").value,
            phone: document.getElementById("f-phone").value,
            location: document.getElementById("f-location").value,
            startDate: document.getElementById("f-start").value,
            status: document.getElementById("f-status").value
          });
        });
      }
      var saveLv = document.getElementById("save-leave");
      if(saveLv){
        saveLv.addEventListener("click", function(){
          saveLeave({
            memberId: document.getElementById("f-member").value,
            type: document.getElementById("f-type").value,
            startDate: document.getElementById("f-start").value,
            endDate: document.getElementById("f-end").value,
            note: document.getElementById("f-note").value
          });
        });
      }
      var savePerf = document.getElementById("save-performance");
      if(savePerf){
        savePerf.addEventListener("click", function(){
          var note = document.getElementById("f-note").value;
          if(!note.trim()){ document.getElementById("f-note").focus(); return; }
          savePerformance({
            memberId: document.getElementById("f-member").value,
            date: document.getElementById("f-date").value,
            rating: document.getElementById("f-rating").value,
            note: note
          });
        });
      }
      var saveProj = document.getElementById("save-project");
      if(saveProj){
        saveProj.addEventListener("click", function(){
          var name = document.getElementById("f-name").value;
          if(!name.trim()){ document.getElementById("f-name").focus(); return; }
          saveProject({
            name: name,
            description: document.getElementById("f-description").value,
            memberId: document.getElementById("f-member").value,
            clientName: document.getElementById("f-client").value,
            service: document.getElementById("f-service").value,
            location: document.getElementById("f-location").value,
            eventDate: document.getElementById("f-event-date").value,
            budget: document.getElementById("f-budget").value
          });
        });
      }
      var saveInv = document.getElementById("save-invite");
      if(saveInv){
        saveInv.addEventListener("click", function(){
          var email = document.getElementById("f-email").value;
          if(!email.trim()){ document.getElementById("f-email").focus(); return; }
          inviteMember({ name: document.getElementById("f-name").value, email: email });
        });
      }
      var saveRcpt = document.getElementById("save-receipt");
      if(saveRcpt){
        saveRcpt.addEventListener("click", function(){
          var client = document.getElementById("f-client").value;
          var amount = document.getElementById("f-amount").value;
          if(!client.trim()){ document.getElementById("f-client").focus(); return; }
          if(!amount){ document.getElementById("f-amount").focus(); return; }
          saveReceipt({
            clientName: client,
            contact: document.getElementById("f-contact").value,
            service: document.getElementById("f-service").value,
            amount: amount,
            paymentMode: document.getElementById("f-payment-mode").value,
            projectId: document.getElementById("f-project").value,
            receiptDate: document.getElementById("f-receipt-date").value,
            note: document.getElementById("f-note").value
          });
        });
      }
      var saveTest = document.getElementById("save-testimonial");
      if(saveTest){
        saveTest.addEventListener("click", function(){
          var body = document.getElementById("f-body").value;
          var client = document.getElementById("f-client").value;
          if(!client.trim()){ document.getElementById("f-client").focus(); return; }
          if(!body.trim()){ document.getElementById("f-body").focus(); return; }
          saveTestimonial({
            clientName: client, body: body,
            rating: document.getElementById("f-rating").value,
            date: document.getElementById("f-date").value,
            source: "Manual"
          });
        });
      }
      var saveSvc = document.getElementById("save-service");
      if(saveSvc){
        saveSvc.addEventListener("click", function(){
          var name = document.getElementById("f-name").value;
          if(!name.trim()){ document.getElementById("f-name").focus(); return; }
          saveService({
            id: state.modal.data ? state.modal.data.id : null,
            name: name,
            description: document.getElementById("f-description").value,
            active: document.getElementById("f-active").value === "true",
            sortOrder: document.getElementById("f-sort").value
          });
        });
      }
      var saveHo = document.getElementById("save-handover");
      if(saveHo){
        saveHo.addEventListener("click", function(){
          handoverProject({
            id: state.modal.data.id,
            toMemberId: document.getElementById("f-member").value,
            note: document.getElementById("f-note").value,
            notifyPrevious: document.getElementById("f-notify-previous").checked
          });
        });
      }
    }
  }

  loadSession();
  render();
  if(state.pin){ loadAll(); }
})();
</script>
</body>
</html>
